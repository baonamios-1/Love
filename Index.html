<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tình Yêu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Tiêu đề */
    .title {
      color: #ff4d6d;
      font-size: 2.5rem;
      margin-bottom: 40px;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.5);
      text-align: center;
      z-index: 10;
    }

    /* Khung chứa trái tim xoay */
    .heart-container {
      position: relative;
      width: 200px;
      height: 200px;
      animation: rotateHeart 8s linear infinite;
    }

    /* Hình dáng trái tim */
    .heart {
      position: absolute;
      width: 120px;
      height: 120px;
      background-color: #ff0055;
      top: 50px;
      left: 40px;
      transform: rotate(-45deg);
      box-shadow: 0 0 40px #ff0055, 0 0 80px #ff0055;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      background-color: #ff0055;
      border-radius: 50%;
    }

    .heart::before {
      top: -60px;
      left: 0;
    }

    .heart::after {
      left: 60px;
      top: 0;
    }

    /* Hiệu ứng xoay tròn và nhịp đập */
    @keyframes rotateHeart {
      0% {
        transform: rotate(0deg) scale(1);
      }
      50% {
        transform: rotate(180deg) scale(1.15);
      }
      100% {
        transform: rotate(360deg) scale(1);
      }
    }

    /* Lời nhắn phía dưới */
    .message {
      margin-top: 50px;
      color: #ffb3c1;
      font-size: 1.2rem;
      letter-spacing: 1px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <h1 class="title">Love You Forever ❤️</h1>

  <div class="heart-container">
    <div class="heart"></div>
  </div>

  <p class="message">Gửi trọn tình yêu đến phương xa...</p>

</body>
</html>
